name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Unzip newest project
        run: |
          ZIP=$(ls allaith_ai_v*.zip | sort -V | tail -1)
          echo "Using $ZIP"
          unzip -q "$ZIP"
      - name: Create android platform
        working-directory: allaith_ai
        run: |
          mkdir -p /tmp/bk
          cp -r pubspec.yaml lib assets /tmp/bk/
          cp android/app/src/main/AndroidManifest.xml /tmp/bk/
          flutter create --org com.allaith --project-name allaith_ai --platforms=android .
          cp /tmp/bk/pubspec.yaml pubspec.yaml
          rm -rf lib && cp -r /tmp/bk/lib lib
          cp /tmp/bk/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf test
      - name: Disable lint
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/nolint.gradle <<'EOT'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lintVital') || t.name.startsWith('lintAnalyze')) {
                t.enabled = false
              }
            }
          }
          EOT
      - name: Build
        working-directory: allaith_ai
        shell: bash
        run: |
          flutter pub get 2>&1 | tee build.log
          dart run flutter_launcher_icons 2>&1 | tee -a build.log
          flutter build apk --release 2>&1 | tee -a build.log
      - name: Show error summary
        if: failure()
        working-directory: allaith_ai
        run: |
          { echo '## Build error'; echo '```'; grep -n -B3 -A12 -E "Error:|error:|What went wrong|Because" build.log | head -120; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: allaith-ai-apk
          path: allaith_ai/build/app/outputs/flutter-apk/app-release.apk
